services:
  db:
    image: pgvector/pgvector:pg16
    container_name: transit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transit}
      POSTGRES_USER: ${POSTGRES_USER:-transit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Used by db/init/03_readonly_role.sh to create the text-to-SQL role
      READONLY_PASSWORD: ${READONLY_PASSWORD:?Set READONLY_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts here run once, in filename order, on first start with an empty volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    # Bulk-load friendly settings; stop_times is tens of millions of rows
    command: >
      postgres
      -c shared_buffers=512MB
      -c maintenance_work_mem=512MB
      -c max_wal_size=4GB
      -c checkpoint_timeout=15min
    shm_size: 512mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
