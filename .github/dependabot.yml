   # Opens one pull request per ecosystem when dependencies have updates.
   # Each one runs CI, so you merge only updates that pass.
   version: 2
   updates:
     - package-ecosystem: pip
       directory: /
       schedule:
         interval: monthly
       groups:
         python-deps:
           patterns: ["*"]

     - package-ecosystem: github-actions
       directory: /
       schedule:
         interval: monthly
       groups:
         actions:
           patterns: ["*"]