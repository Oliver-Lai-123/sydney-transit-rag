name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Same values as .env.example, which this job copies to .env
      TEST_DATABASE_URL: postgresql://transit_admin:change-me-admin@127.0.0.1:5433/transit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # The same docker compose setup you run locally, so CI also checks
      # that the compose file and db/init scripts still work
      - name: Start database
        run: |
          cp .env.example .env
          docker compose up -d --wait

      - name: Unit and integration tests
        run: pytest -v

      - name: Load GTFS fixture
        run: python scripts/load_gtfs.py --dir tests/fixtures/mini_gtfs

      # Runs every gold_sql as the read-only role. --allow-empty because CI
      # only has the small fixture: questions written against the real feed
      # can return no rows here, but they must still run without errors.
      - name: Validate eval set
        run: python eval/validate_eval_set.py --run-sql --allow-empty

      - name: Database logs
        if: failure()
        run: docker compose logs db
