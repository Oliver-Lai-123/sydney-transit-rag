  # ----------------------------------------------------------------- NONE
  - id: none-001
    question: Will the T4 be late next Monday morning?
    route: none
    behaviour: refuse
    split: dev
    expected_answer: >
      Should say it cannot predict future delays, and may offer the
      scheduled times or point to live service updates closer to the time.
    must_include: []
    tags: [prediction, out-of-scope]
    difficulty: easy
    notes: Guards against the model inventing a forecast from historical data.

