  # ----------------------------------------------------------------- BOTH
  - id: both-001
    question: Is Hurstville Station wheelchair accessible, and how do I get help boarding?
    route: both
    behaviour: answer
    split: dev
    gold_sql: |
      SELECT stop_name, wheelchair_boarding
      FROM gtfs.stops
      WHERE stop_name = 'Hurstville Station' AND location_type = 1
    gold_doc_ids: [TODO]
    expected_answer: TODO
    must_include: []
    tags: [accessibility, multi-source]
    difficulty: medium
    notes: >
      Accessibility status comes from GTFS (wheelchair_boarding); how to
